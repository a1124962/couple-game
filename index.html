<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>回声与骨</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="data/core.js"></script>
<script src="data/events.js"></script>
<script src="data/npcs.js"></script>
<script src="data/endings.js"></script>
<script src="data/minigames.js"></script>
<script src="engine.js"></script>
<script src="R.js"></script>
<style>
:root{--cream:#fff8f0;--peach:#ffb5c2;--lav:#c8b6ff;--sky:#a8d8ea;--ink:#5f4b66;--inkl:#7a6685;}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans SC",system-ui,sans-serif;}
html,body{width:100%;height:100%;background:radial-gradient(circle at top,#fff5fa 0%,#fff8f0 55%,#f6f0ff 100%);color:var(--ink);overflow:hidden;overflow-x:hidden;max-width:100%;}
body{position:relative;display:flex;flex-direction:column;align-items:center;}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;}
#app{position:relative;width:min(94vw,560px);max-width:100%;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,12px)+12px) 0 calc(env(safe-area-inset-bottom,12px)+12px);z-index:2;overflow:hidden;box-sizing:border-box;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;width:100%;height:100%;padding:calc(env(safe-area-inset-top,12px)+12px) 14px calc(env(safe-area-inset-bottom,12px)+14px);gap:14px;opacity:0;transform:translateY(14px);transition:opacity .36s,transform .36s;pointer-events:none;overflow-y:auto;box-sizing:border-box;}
.screen.active{display:flex;opacity:1;transform:translateY(0);pointer-events:auto;}
.glass{width:100%;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border:1px solid rgba(200,182,255,.28);border-radius:26px;padding:20px;box-shadow:0 20px 60px -30px rgba(184,146,255,.9);display:flex;flex-direction:column;gap:14px;}
.title{text-align:center;font-size:clamp(20px,5vw,26px);font-weight:700;letter-spacing:6px;}
.sub{text-align:center;font-size:13px;color:var(--inkl);}
.field{display:flex;flex-direction:column;gap:8px;}
input.txt{width:100%;border-radius:999px;border:1px solid transparent;padding:12px 18px;background:rgba(255,255,255,.9);font-size:15px;text-align:center;}
input.txt:focus{outline:none;border-color:rgba(200,182,255,.9);box-shadow:0 0 0 6px rgba(200,182,255,.16);}
.color-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.color-dot{width:44px;height:44px;border-radius:50%;border:none;box-shadow:0 12px 30px -18px currentColor;transition:transform .16s;}
.color-dot.active{transform:scale(1.12);outline:3px solid #fff;}
.row{display:flex;flex-direction:column;gap:10px;}
.btn{border:none;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,#ffb5c2,#c8b6ff);color:#fff;box-shadow:0 18px 40px -22px rgba(184,146,255,1);transition:transform .14s;min-height:44px;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid rgba(200,182,255,.4);box-shadow:none;}
.join-row{display:flex;gap:8px;}
.join-row input{flex:1;letter-spacing:8px;text-transform:uppercase;}
.room-panel{display:none;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.room-panel.active{display:flex;}
.room-code{font-size:clamp(30px,9vw,44px);letter-spacing:14px;font-weight:700;}
.toast-wrap{position:fixed;bottom:calc(env(safe-area-inset-bottom,12px)+18px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:14;}
.toast{padding:9px 16px;border-radius:999px;background:rgba(95,75,102,.86);color:#fff;font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .28s,transform .28s;}
.toast.show{opacity:1;transform:translateY(0);}
#reconn{position:fixed;top:0;left:50%;transform:translate(-50%,-120%);width:min(92vw,560px);padding:10px 18px;border-radius:0 0 999px 999px;background:linear-gradient(90deg,#ffb5c2,#c8b6ff);color:#fff;font-size:13px;text-align:center;opacity:0;transition:transform .42s,opacity .42s;z-index:12;}
#reconn.show{transform:translate(-50%,0);opacity:1;}
#reconn.ok{background:linear-gradient(90deg,#a8d8ea,#c8b6ff);}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,10vw,36px);padding:4px 0;}
.stick-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.stick-name{font-size:13px;color:var(--inkl);}
.stick-svg{width:clamp(86px,22vw,110px);height:clamp(124px,30vw,148px);overflow:visible;}
.stick-svg .s{stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:320;stroke-dashoffset:320;animation:draw .92s ease forwards;}
.stick-svg .b{transform-origin:center bottom;animation:breath 2.8s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes breath{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.012);}}
.lobby-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.mode-card{border:none;border-radius:20px;padding:14px;text-align:left;background:rgba(255,255,255,.82);border:1px solid rgba(200,182,255,.32);box-shadow:0 18px 40px -28px rgba(184,146,255,1);display:flex;flex-direction:column;gap:4px;min-height:44px;}
.mode-card:active{transform:scale(.98);}
.mode-card-t{font-weight:600;}
.mode-card-s{font-size:12px;color:var(--inkl);}
.mode-head{width:100%;display:flex;align-items:center;justify-content:space-between;}
.mode-title{font-weight:600;}
.icon-btn{border:none;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.8);border:1px solid rgba(200,182,255,.36);color:var(--ink);min-height:44px;}
.mode-body{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:0 4px;}
.soft{border-radius:20px;background:rgba(255,255,255,.86);border:1px solid rgba(200,182,255,.26);padding:16px;display:flex;flex-direction:column;gap:10px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.pill{border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.32);font-size:13px;min-height:44px;}
.pill.active{background:linear-gradient(90deg,#ffb5c2,#c8b6ff);color:#fff;border-color:transparent;}
.qa-q{text-align:center;font-size:16px;}
textarea.qa{width:100%;min-height:80px;border-radius:16px;border:1px solid rgba(200,182,255,.28);padding:10px 14px;background:rgba(255,255,255,.95);resize:none;font-size:14px;}
textarea.qa:disabled{opacity:.6;}
.reveal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.reveal-card{border-radius:16px;padding:14px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.26);min-height:110px;display:flex;flex-direction:column;gap:6px;}
.canvas-wrap{position:relative;width:100%;border-radius:22px;overflow:hidden;border:1px solid rgba(200,182,255,.3);}
#drawCanvas{width:100%;height:300px;display:block;background:radial-gradient(circle at top,#fff,#f9f6ff);touch-action:none;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.toolbar .c{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(200,182,255,.4);}
.toolbar .c.active{box-shadow:0 0 0 2px #c8b6ff;}
.toolbar select,.toolbar button{border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.32);min-height:44px;}
.heart-burst{position:fixed;pointer-events:none;z-index:20;font-size:26px;animation:burst 1.2s ease forwards;}
@keyframes burst{0%{transform:scale(0) translate(0,0);opacity:1;}100%{transform:scale(1.4) translate(var(--dx),var(--dy));opacity:0;}}
.flash-overlay{position:fixed;inset:0;pointer-events:none;z-index:21;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;}
.flash-overlay.show{opacity:1;}
.flash-overlay .big{font-size:clamp(26px,8vw,40px);white-space:nowrap;text-align:center;}
.mid-heart{font-size:26px;align-self:center;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.mc-e{font-size:20px;margin-right:4px}
.mode-card{transition:transform .2s,box-shadow .2s}.mode-card:hover{transform:translateY(-3px)}.mode-card:active{transform:scale(.96)}
#modeBody div[style*="display:flex;gap:8px"]>input.txt{flex:1;text-align:left}
#modeBody div[style*="display:flex;gap:8px"]>.btn{white-space:nowrap;flex-shrink:0}
.confirm-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(95,75,102,.35);z-index:30;padding:20px;box-sizing:border-box;}
.confirm-overlay.show{display:flex;}
.confirm-box{width:min(92vw,360px);background:rgba(255,255,255,.96);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 24px 60px -28px rgba(95,75,102,.9);}
.confirm-box .btn{width:100%;}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="reconn">对方连接中断，正在尝试重连…</div>
<div id="toast-wrap" class="toast-wrap"></div>
<div id="flash" class="flash-overlay"><div class="big"></div></div>
<div id="confirmOverlay" class="confirm-overlay"><div class="confirm-box"><div>确认返回大厅吗？</div><button id="confirmYes" class="btn">确认</button><button id="confirmNo" class="btn ghost">取消</button></div></div>
<div id="app">
  <section id="s-home" class="screen active">
    <div class="glass">
      <div class="title">回声与骨</div>
      <div class="sub">在骨与回声之间，彼此相认</div>
      <div class="field"><label class="sub" style="text-align:left;">昵称</label><input id="nameInput" class="txt" placeholder="写下你的名字" maxlength="12"></div>
      <div class="field"><label class="sub" style="text-align:left;">选择你的颜色</label><div id="colorGrid" class="color-grid"></div></div>
      <div class="row"><button id="createBtn" class="btn">创建房间</button></div>
      <div class="join-row"><input id="joinInput" class="txt" placeholder="房间码" maxlength="6"><button id="joinBtn" class="btn">加入</button></div>
      <div id="roomPanel" class="room-panel">
        <div class="sub">房间码</div>
        <div id="roomCode" class="room-code"></div>
        <button id="copyBtn" class="btn ghost">复制邀请链接</button>
        <div id="status" class="sub">等待对方加入…</div>
      </div>
      <div class="sub">玩法：创建或加入房间后，在大厅选择模式。冒险由房主权威同步，猜猜看和绘画实时同步。</div>
    </div>
  </section>
  <section id="s-lobby" class="screen">
    <div class="glass">
      <div class="title" style="font-size:20px;letter-spacing:4px;">回声大厅</div>
      <div class="pair" id="lobbyPair"></div>
      <div class="lobby-grid">
        <button class="mode-card" data-mode="adventure"><div class="mode-card-t"><span class="mc-e">📖</span> 共同冒险</div><div class="mode-card-s">双人合作肉鸽、抽卡、NPC、九种结局</div></button>
        <button class="mode-card" data-mode="guess"><div class="mode-card-t"><span class="mc-e">🎯</span> 默契猜猜看</div><div class="mode-card-s">默契加分、连击挑战</div></button>
        <button class="mode-card" data-mode="draw"><div class="mode-card-t"><span class="mc-e">🎨</span> 一起画</div><div class="mode-card-s">实时画板，共同作画</div></button>
      </div>
      <button id="continueAdvBtn" class="btn ghost" style="display:none;">继续上次的冒险</button>
    </div>
  </section>
  <section id="s-mode" class="screen">
    <div class="glass" style="flex:1;min-height:0;">
      <div class="mode-head">
        <div class="mode-title" id="modeTitle">模式</div>
        <div style="display:flex;gap:8px;">
          <button id="heartBtn" class="icon-btn">❤</button>
          <button id="backBtn" class="icon-btn">返回大厅</button>
        </div>
      </div>
      <div class="mode-body" id="modeBody"></div>
    </div>
  </section>
</div>
<script>
var COLORS=['#ff8fa3','#ffb5c2','#c8b6ff','#a8d8ea','#f9a8d4','#b8e0d2'];
var me={role:'guest',name:'',color:COLORS[0]};
var S={players:{host:{name:'',color:COLORS[0]},guest:{name:'',color:COLORS[1]}},mode:null,adv:null,guess:{round:0,score:0,streak:0,roleTurn:'host',picked:{},revealed:false,used:[],category:'全部'},draw:{promptIdx:0,clears:0},strokes:[]};
var conn=null,peer=null,connected=false,reconnectTimer=null,hostPeerId=null;
var $=function(id){return document.getElementById(id);};
var show=function(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});var el=$(id);if(el)el.classList.add('active');};
var toast=function(m){var w=$('toast-wrap');var t=document.createElement('div');t.className='toast';t.textContent=m;w.appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},300);},2200);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});};
function stickSVG(pose,color){
  var c=color||'#ff8fa3';
  var arms='';var legs='';
  switch(pose){
    case 'wave': arms='<line x1="50" y1="46" x2="78" y2="30" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="22" y2="58" stroke="'+c+'" stroke-width="3"/>';break;
    case 'hug': arms='<path d="M46 46 Q30 56 24 70" stroke="'+c+'" stroke-width="3" fill="none"/><path d="M54 46 Q70 56 76 70" stroke="'+c+'" stroke-width="3" fill="none"/>';break;
    default: arms='<line x1="50" y1="46" x2="74" y2="58" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="26" y2="58" stroke="'+c+'" stroke-width="3"/>';legs='<line x1="50" y1="78" x2="66" y2="108" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="34" y2="108" stroke="'+c+'" stroke-width="3"/>';
  }
  if(!legs) legs='<line x1="50" y1="78" x2="66" y2="108" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="34" y2="108" stroke="'+c+'" stroke-width="3"/>';
  return ('<svg class="stick-svg" viewBox="0 0 100 130"><g class="b"><circle cx="50" cy="24" r="12" stroke="'+c+'" stroke-width="3" class="s"/><line x1="50" y1="36" x2="50" y2="78" stroke="'+c+'" stroke-width="3" class="s"/>'+arms+legs+'</g></svg>').replace(/ class="s"/g,'').replace(/<(line|path|circle)/g,'<$1 class="s"');
}
function advTextEsc(s){return esc(typeof advText==='function'?advText(s):s);}
function burstHearts(){
  for(var i=0;i<12;i++){var h=document.createElement('div');h.className='heart-burst';h.textContent='❤';h.style.left=(window.innerWidth/2-12)+'px';h.style.top=(window.innerHeight/2-12)+'px';h.style.setProperty('--dx',(Math.random()*200-100)+'px');h.style.setProperty('--dy',(Math.random()*200-200)+'px');document.body.appendChild(h);setTimeout(function(el){el.remove();},1200,h);}
}
function advDispatch(action){
  if(me.role==='host'){advReduce(S.adv,action,'host');broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});saveAdv();render();}
  else if(conn&&conn.open){conn.send({type:'action',action:{type:'adv',a:action}});}
}
function saveAdv(){if(me.role==='host'&&S.adv){try{localStorage.setItem('advSnapshot',JSON.stringify(S.adv));}catch(e){}}}
function broadcast(msg){if(conn&&conn.open)conn.send(msg);}
var lastKey='',lastLogLen=0;
function render(){
  var gd=window.GAME_DATA;
  var focusId=document.activeElement&&document.activeElement.id;
  var keep={};document.querySelectorAll('#modeBody textarea[id],#modeBody input[id]').forEach(function(el){if(el.type!=='color'&&el.type!=='range')keep[el.id]=el.value;});
  try{renderInner(gd);}catch(e){console.warn(e);}
  Object.keys(keep).forEach(function(id){var el=$(id);if(el&&!el.disabled&&!el.value)el.value=keep[id];});
  if(focusId){var f=$(focusId);if(f&&f!==document.activeElement&&f.tagName!=='BUTTON')f.focus();}
}
function renderInner(gd){
  var lp=$('lobbyPair');
  if(lp){lp.innerHTML='<div class="stick-wrap">'+stickSVG('heart',S.players.host.color)+'<div class="stick-name">'+esc(S.players.host.name)+'</div></div><div class="mid-heart">💞</div><div class="stick-wrap">'+stickSVG('heart',S.players.guest.color)+'<div class="stick-name">'+esc(S.players.guest.name)+'</div></div>';}
  var cb=$('continueAdvBtn');
  if(cb){var snap=localStorage.getItem('advSnapshot');cb.style.display=(me.role==='host'&&snap)?'':'none';cb.onclick=function(){try{S.adv=JSON.parse(snap);render();}catch(e){toast('读取失败');}};}
  if(S.mode===null){lastKey='';show('s-lobby');return;}
  show('s-mode');
  var title=$('modeTitle');var body=$('modeBody');if(!body)return;
  if(S.mode==='adventure'){
    title.textContent='共同冒险';
    if(!S.adv)S.adv=advInit();
    advInjectCSS();
    advRender(body);
    return;
  }
  if(S.mode==='guess'){
    title.textContent='默契猜猜看';
    if(!S.guess)S.guess={round:0,score:0,streak:0,roleTurn:'host',picked:{},revealed:false,used:[],category:'全部'};
    var cats=['全部'].concat(Array.from(new Set(gd.guessQuestions.map(function(q){return q.cat;}))));
    var pool=gd.guessQuestions.filter(function(q,i){return (S.guess.category==='全部'||q.cat===S.guess.category)&&S.guess.used.indexOf(i)<0;});
    if(pool.length===0){S.guess.used=[];pool=gd.guessQuestions.filter(function(q){return S.guess.category==='全部'||q.cat===S.guess.category;});}
    var idx=gd.guessQuestions.indexOf(pool[Math.floor(Math.random()*pool.length)]);
    if(S.guess.currentIdx===undefined)S.guess.currentIdx=idx;
    var q=gd.guessQuestions[S.guess.currentIdx];
    var total=10;
    body.innerHTML='<div class="soft"><div class="pill-row">'+cats.map(function(c){return '<button class="pill '+(c===S.guess.category?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div><div class="qa-q">'+esc(q.q)+'</div><div class="sub">第 '+(S.guess.round+1)+'/'+total+' 题 · 答题人：'+esc(S.players[S.guess.roleTurn].name)+' · 分数：'+S.guess.score+' · 连击：'+S.guess.streak+'</div><div class="sub">'+(S.guess.roleTurn===me.role?'请秘密选择你的真实答案':'请猜 TA 会选哪个')+'　'+(S.guess.revealed?'':(S.guess.picked[S.guess.roleTurn==='host'?'guest':'host']!==undefined?'对方已锁定 ✓':'等待对方…'))+'</div><div class="pill-row">'+q.options.map(function(o){return '<button class="pill '+(S.guess.picked[me.role]===o?'active':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div><div style="display:flex;gap:8px;"><button class="btn" id="gLock">锁定答案</button><button class="btn ghost" id="gNext">下一题</button></div></div>';
    if(S.guess.revealed){
      var match=S.guess.picked.host===S.guess.picked.guest;
      body.innerHTML+='<div class="qa-q" style="text-align:center">'+(match?'💞 心有灵犀！':'😜 差一点点～')+'</div><div class="reveal"><div class="reveal-card"><div class="sub">'+esc(S.players.host.name)+'</div><div>'+esc(S.guess.picked.host)+'</div></div><div class="reveal-card"><div class="sub">'+esc(S.players.guest.name)+'</div><div>'+esc(S.guess.picked.guest)+'</div></div></div><div class="sub">'+esc((match?gd.guessReveal.match:gd.guessReveal.miss)[Math.floor(Math.random()*((match?gd.guessReveal.match:gd.guessReveal.miss).length))])+'</div>';
    }
    if(S.guess.round>=total){
      var rate=Math.round((S.guess.score/total)*100);
      var title2=rate>=90?'灵魂共振体':rate>=70?'默契拍档':rate>=50?'渐入佳境':rate>=30?'还需要磨合':'新手情侣';
      body.innerHTML+='<div class="soft" style="text-align:center"><div class="qa-q">本轮结束</div><div>正确率 '+rate+'% · 总分 '+S.guess.score+'</div><div class="sub">称号：'+title2+'</div><button class="btn" id="gAgain">再来一轮</button></div>';
      var ga=$('gAgain');if(ga)ga.onclick=function(){S.guess={round:0,score:0,streak:0,roleTurn:'host',picked:{},revealed:false,used:[],category:S.guess.category,currentIdx:undefined};render();};
    }
    body.querySelectorAll('.pill[data-cat]').forEach(function(p){p.onclick=function(){S.guess.category=p.dataset.cat;S.guess.currentIdx=undefined;render();};});
    body.querySelectorAll('.pill[data-v]').forEach(function(p){p.onclick=function(){S.guess.picked[me.role]=p.dataset.v;render();};});
    var gl=$('gLock');if(gl)gl.onclick=function(){if(S.guess.picked[me.role]===undefined){toast('先选一个');return;}if(conn&&me.role!=='host')conn.send({type:'action',action:{type:'guessPick',val:S.guess.picked[me.role]}});if(me.role==='host'){if(!S.guess.picked.guest!==undefined){toast('等待对方');} }render();};
    var gn=$('gNext');if(gn)gn.onclick=function(){if(!S.guess.revealed){toast('双方提交后才能下一题');return;}S.guess.used.push(S.guess.currentIdx);S.guess.round++;S.guess.picked={};S.guess.revealed=false;S.guess.roleTurn=S.guess.roleTurn==='host'?'guest':'host';S.guess.currentIdx=undefined;if(me.role==='host')broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();};
    return;
  }
  if(S.mode==='draw'){
    title.textContent='一起画';
    body.innerHTML='<div class="soft"><div class="sub">题目：'+esc(gd.drawPrompts[S.draw.promptIdx||0])+'</div><div class="toolbar"><input type="color" id="colorPick" value="#ff8fa3"><input type="range" id="sizePick" min="2" max="20" value="4"><button class="icon-btn" id="eraserBtn">橡皮</button><button class="icon-btn" id="clearBtn">清空</button><button class="icon-btn" id="promptBtn">换题</button><button class="icon-btn" id="revealBtn">揭晓</button></div></div><div class="canvas-wrap"><canvas id="drawCanvas"></canvas></div>';
    initDraw();
    return;
  }
}
var drawing=false,ctx=null,last=null,eraser=false,drawSecret=false;
function initDraw(){
  var canvas=$('drawCanvas');if(!canvas)return;
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineCap='round';ctx.lineJoin='round';
  (S.strokes||[]).forEach(drawStroke);
  var colorPick=$('colorPick'),sizePick=$('sizePick');
  var getPos=function(e){var r=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height};};
  var start=function(e){drawing=true;last=getPos(e);};
  var move=function(e){if(!drawing)return;var p=getPos(e);var c=colorPick.value;var w=+sizePick.value;var stroke={from:last,to:p,color:eraser?'#ffffff':c,width:w,eraser:eraser};drawStroke(stroke);if(me.role==='host'){S.strokes.push(stroke);broadcast({type:'stroke',stroke:stroke});}else if(conn&&conn.open){conn.send({type:'stroke',stroke:stroke});}last=p;};
  var end=function(){drawing=false;last=null;};
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();start(e);},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();move(e);},{passive:false});
  canvas.addEventListener('touchend',function(e){e.preventDefault();end();},{passive:false});
  var eraserBtn=$('eraserBtn');if(eraserBtn)eraserBtn.onclick=function(){eraser=!eraser;eraserBtn.textContent=eraser?'画笔':'橡皮';};
  var clearBtn=$('clearBtn');if(clearBtn)clearBtn.onclick=function(){S.strokes=[];S.draw.clears=(S.draw.clears||0)+1;if(me.role==='host')broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});else if(conn&&conn.open)conn.send({type:'action',action:{type:'clearStrokes'}});render();};
  var promptBtn=$('promptBtn');if(promptBtn)promptBtn.onclick=function(){var gd=window.GAME_DATA;var idx=Math.floor(Math.random()*gd.drawPrompts.length);S.draw.promptIdx=idx;if(me.role==='host')broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});else if(conn&&conn.open)conn.send({type:'action',action:{type:'drawPrompt',idx:idx}});render();};
  var revealBtn=$('revealBtn');if(revealBtn)revealBtn.onclick=function(){drawSecret=!drawSecret;toast(drawSecret?'题目已隐藏':'题目已揭晓');render();};
}
function drawStroke(s){
  if(!ctx)return;
  var canvas=$('drawCanvas');var r=canvas.getBoundingClientRect();
  ctx.strokeStyle=s.eraser?'#ffffff':s.color;ctx.lineWidth=s.width;
  ctx.beginPath();ctx.moveTo(s.from.x*r.width,s.from.y*r.height);ctx.lineTo(s.to.x*r.width,s.to.y*r.height);ctx.stroke();
}
function showReconn(show){var r=$('reconn');if(!r)return;if(show){r.classList.remove('ok');r.textContent='对方连接中断，正在尝试重连…';r.classList.add('show');}else{r.classList.add('ok');r.textContent='重新连上啦 💞';setTimeout(function(){r.classList.remove('show');},2000);}}
var reconnectAttempts=0;
function startReconnect(){
  if(reconnectTimer)clearInterval(reconnectTimer);
  reconnectTimer=setInterval(function(){
    if(connected){clearInterval(reconnectTimer);reconnectTimer=null;reconnectAttempts=0;return;}
    if(me.role==='guest'){
      reconnectAttempts++;
      if(reconnectAttempts>6){clearInterval(reconnectTimer);reconnectTimer=null;toast('重连失败，请刷新');return;}
      var delay=Math.min(3000*Math.pow(2,reconnectAttempts-1),15000);
      setTimeout(function(){if(!connected){if(peer&&peer.disconnected)peer.reconnect();else if(hostPeerId){if(peer)try{peer.destroy();}catch(e){}peer=new Peer();peer.on('open',function(){connectTo(hostPeerId.replace('lovegame-v1-',''));});}}},delay);
    }
  },1000);
}
function connectTo(code){
  var id='lovegame-v1-'+code;
  if(!peer||peer.destroyed)peer=new Peer();
  conn=peer.connect(id,{reliable:true});
  wireConn(conn);
}
function wireConn(c){
  c.on('open',function(){if(c!==conn){try{if(conn&&conn!==c)conn.close();}catch(e){}conn=c;}connected=true;showReconn(false);toast('连上啦 💞');if(me.role==='guest'){c.send({type:'hello',name:me.name,color:me.color});}});
  c.on('data',function(d){
    if(d.type==='hello'){S.players.guest={name:d.name,color:d.color};if(me.role==='host'){S.players.host={name:me.name,color:me.color};broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();}}
    if(d.type==='sync'){S=d.S;render();}
    if(d.type==='mode'){
      if(me.role==='host'){
        var allowed=[null,'adventure','guess','draw'];
        if(allowed.indexOf(d.mode)>=0){
          if(d.mode==='adventure'&&!S.adv)S.adv=advInit();
          S.mode=d.mode;
          broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});
          render();
        }
      }
    }
    if(d.type==='action'){
      if(me.role==='host'){
        var act=d.action;
        if(act.type==='adv'){advReduce(S.adv,act.a,'guest');}
        else if(typeof reduce==='function'){reduce(S,act,'guest');}
        broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();
      }
    }
    if(d.type==='stroke'){drawStroke(d.stroke);if(me.role==='host'){S.strokes.push(d.stroke);}}
  });
  c.on('close',function(){if(c!==conn)return;connected=false;showReconn(true);startReconnect();});
  c.on('error',function(e){toast('连接错误：'+e.type);});
}
var colorGrid=$('colorGrid');
COLORS.forEach(function(c,i){var d=document.createElement('button');d.className='color-dot';d.style.background=c;d.dataset.color=c;if(i===0)d.classList.add('active');d.onclick=function(){document.querySelectorAll('.color-dot').forEach(function(x){x.classList.remove('active');});d.classList.add('active');me.color=c;};colorGrid.appendChild(d);});
var savedName=localStorage.getItem('name');if(savedName)$('nameInput').value=savedName;
var savedColor=localStorage.getItem('color');if(savedColor){me.color=savedColor;document.querySelectorAll('.color-dot').forEach(function(x){x.classList.toggle('active',x.dataset.color===savedColor);});}
$('createBtn').onclick=function(){
  var name=$('nameInput').value.trim();if(!name){toast('先写个昵称');return;}me.name=name;me.role='host';localStorage.setItem('name',name);localStorage.setItem('color',me.color);
  S.players.host={name:name,color:me.color};
  var code='';var CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(var i=0;i<6;i++)code+=CHARS[Math.floor(Math.random()*CHARS.length)];
  var tries=0;
  function tryCreate(){
    var id='lovegame-v1-'+code;
    try{peer=new Peer(id);}catch(e){toast('PeerJS 加载失败');return;}
    peer.on('open',function(){hostPeerId=id;$('roomCode').textContent=code;$('roomPanel').classList.add('active');$('status').textContent='等待对方加入…';});
    peer.on('connection',function(c){var old=conn;conn=c;wireConn(c);c.on('open',function(){try{if(old&&old!==c)old.close();}catch(e){}connected=true;showReconn(false);toast('对方加入啦 💞');S.players.host={name:me.name,color:me.color};broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();});});
    peer.on('disconnected',function(){setTimeout(function(){try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect();}catch(e){}},1500);});
    peer.on('error',function(e){
      if(e.type==='unavailable-id'){tries++;if(tries<5){code='';for(var j=0;j<6;j++)code+=CHARS[Math.floor(Math.random()*CHARS.length)];tryCreate();}else toast('创建失败，请重试');}
      else if(e.type==='peer-unavailable')toast('房间不存在');
      else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error')toast('网络不稳定，正在重试…');
      else toast('连接出错：'+e.type);
    });
  }
  tryCreate();
};
$('joinBtn').onclick=function(){
  var name=$('nameInput').value.trim();var code=$('joinInput').value.trim().toUpperCase();if(!name){toast('先写个昵称');return;}if(!code){toast('输入房间码');return;}me.name=name;me.role='guest';localStorage.setItem('name',name);localStorage.setItem('color',me.color);hostPeerId='lovegame-v1-'+code;
  try{peer=new Peer();}catch(e){toast('PeerJS 加载失败');return;}
  peer.on('open',function(){if(!conn||!conn.open)connectTo(code);});
  peer.on('disconnected',function(){setTimeout(function(){try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect();}catch(e){}},1500);});
  peer.on('error',function(e){if(e.type==='peer-unavailable'){toast('房间不存在或房主已离开');}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error')toast('网络不稳定，正在重试…');else toast('连接出错：'+e.type);});
};
$('copyBtn').onclick=function(){var code=$('roomCode').textContent;var url=location.origin+location.pathname+'?room='+code;navigator.clipboard.writeText(url).then(function(){toast('链接已复制');});};
var params=new URLSearchParams(location.search);if(params.get('room')){$('joinInput').value=params.get('room');}
document.querySelectorAll('.mode-card[data-mode]').forEach(function(b){b.onclick=function(){
  if(!connected&&me.role!=='host'){toast('等待连接');return;}
  var mode=b.dataset.mode;
  if(me.role==='host'){
    if(mode==='adventure'&&!S.adv)S.adv=advInit();
    S.mode=mode;
    broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});
    render();
  }else{
    if(conn&&conn.open){conn.send({type:'mode',mode:mode});toast('等待主机…');}
    else toast('等待连接');
  }
};});
function doBackToLobby(){
  if(me.role==='host'){
    S.mode=null;
    broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});
    render();
  }else{
    if(conn&&conn.open){conn.send({type:'mode',mode:null});toast('等待主机…');}
    else toast('等待连接');
  }
  $('confirmOverlay').classList.remove('show');
}
$('backBtn').onclick=function(){$('confirmOverlay').classList.add('show');};
$('confirmYes').onclick=doBackToLobby;
$('confirmNo').onclick=function(){$('confirmOverlay').classList.remove('show');};
$('heartBtn').onclick=function(){burstHearts();if(conn&&conn.open)conn.send({type:'heart'});};
Object.defineProperty(window,'__game',{get:function(){return {S:S,me:me,connected:connected};}});
// particles
var pc=$('particles');var pctx=pc.getContext('2d');
function resizeP(){pc.width=window.innerWidth;pc.height=window.innerHeight;}resizeP();window.addEventListener('resize',resizeP);
var parts=Array.from({length:40},function(){return {x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*2+1,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,t:Math.random()*Math.PI*2};});
function loopP(){pctx.clearRect(0,0,pc.width,pc.height);parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.t+=.02;if(p.x<0||p.x>pc.width)p.vx*=-1;if(p.y<0||p.y>pc.height)p.vy*=-1;pctx.globalAlpha=.5+.5*Math.sin(p.t);pctx.fillStyle=Math.random()>.5?'#ffb5c2':'#c8b6ff';pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,Math.PI*2);pctx.fill();});requestAnimationFrame(loopP);}loopP();
// window resize redraw canvas
window.addEventListener('resize',function(){if(S.mode==='draw'&&$('drawCanvas')){render();}});
</script>
