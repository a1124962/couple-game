影子。谁都舍不得说回家，心里都默默希望这一刻能再长一点。","pose":"hug","choices":[{"label":"一起在沙滩坐到深夜","next":"n11"},{"label":"冒着风去找潮间带","next":"n12"}]},"n8":{"text":"你们坐在沙滩边啃着冰淇淋，迎着微凉海风把剩下的香草冰淇淋一口分食。突然一只贪吃的流浪猫出现，左右摇摆地同时在两人腿间转圈，摆明了只想平分你们的所有甜品。","pose":"sit","choices":[{"label":"假装不理猫偷偷分享","next":"n11"},{"label":"跟猫展开无声争夺","next":"n12"}]},"n9":{"text":"你们并排坐在礁石上，十指紧扣任潮水一次次扑上来又退下。夜空中浮起稀薄的雾气，将远处渔火晕成一团温暖的光。此刻全世界都只剩下彼此心跳，连浪声都变得小心翼翼。","pose":"heart","choices":[{"label":"许个只属于今夜的心愿","next":"n13"},{"label":"干脆什么都不说只靠着","next":"n14"}]},"n10":{"text":"你们光着脚在退潮后的沙滩上追逐，溅起一串水花又立马被浪重新抹平。你们跌跌撞撞地倒在松软沙地，手撑在对方肩上气喘吁吁，笑到连坐起来都要花很大力气。","pose":"run","choices":[{"label":"就这样躺着看星空","next":"n13"},{"label":"用贝壳给对方刻个名字","next":"n14"}]},"n11":{"text":"你们裹着同一条薄毯躺在沙滩上，仰头数着零星星子。第一颗流星划过天际时，你们同时闭眼许愿，睁眼却都先问对方许了什么，结果两人异口同声说：许的是同一个愿望。","pose":"heart","ending":"温暖","choices":[]},"n12":{"text":"你们跟那只油光水滑的猫展开史诗级拉锯战，明明是三个人抢一小块冰淇淋却都输给了它。最后气鼓鼓地坐在一起分着最后一勺，猫心满意足地趴在中间，像是在主持你们的团圆晚宴。","pose":"wave","ending":"搞笑","choices":[]},"n13":{"text":"潮水渐渐涨起，轻轻卷过你们并排的脚踝，像是不舍地想带走这一晚。你们知道明天还会各自有忙碌的日子，却都明白：无论多远，这片会潮起潮落的海边，永远会留着你们今夜的心动。","pose":"hug","ending":"感人","choices":[]},"n14":{"text":"你们坐在礁石上写下一行小小的名字，用潮水刚退的湿沙堆出一个歪歪扭扭的爱心。下一波浪立马温柔地将它抹去。你们相视一笑，心想：比起刻在石头上，藏在心里反而更不会褪色。","pose":"heart","ending":"温暖","choices":[]}}},{"id":"wuxia","title":"古代江湖","emoji":"⚔️","scene":"wuxia","start":"n0","nodes":{"n0":{"text":"你们乔装成江湖行商，随夜色潜入偏僻驿站避雨。窗外雷声轰鸣，马厩里一匹老马打着瞌睡，梁上却隐约传来细微脚步。两人心照不宣地交换眼神：今晚多半有热闹要看。","pose":"stand","choices":[{"label":"躲起来暗中观察","next":"n1"},{"label":"主动查探来历","next":"n2"}]},"n1":{"text":"你们屏息藏在柴房，透过板缝瞧见十余名黑衣人正低声分配暗器，似乎是要对今夜投宿的某位客栈贵客下手。两人同时攥紧袖中仅备的匕首，却又同时觉得：这回绝不能置身事外。","pose":"stand","choices":[{"label":"设法先发制人","next":"n3"},{"label":"转移目标保护客人","next":"n4"}]},"n2":{"text":"你们装作酒足饭饱的路人坐到偏桌，故意大声聊着冗长家常好掩饰耳力。邻桌几人神色一凛，改用手语交流，结果全被你们从对话间隙听了个七八分，连计划的时辰都摸了个清楚。","pose":"sit","choices":[{"label":"速去通知店小二","next":"n3"},{"label":"直接跟踪黑衣人","next":"n4"}]},"n3":{"text":"暴雨助你们一臂之力，黑衣人正要潜入后院时，瓦檐滴水盖过了脚步。你们从两侧包抄，刀光在火把下交错一闪，顷刻间便将首批人拦了下来。可远处更多黑影正循着喊声赶来。","pose":"fight","choices":[{"label":"护住客栈大门","next":"n5"},{"label":"引开敌人到空地","next":"n6"}]},"n4":{"text":"你们悄悄尾随黑衣人穿过后巷，淋着冷雨在积水中绕来绕去。对方戒心极重，频频回头，你们便装作打情骂俏的赶路夫妇，挽着手慢慢晃悠，连最老练的江湖人都差点被你们这幅腔调骗过。","pose":"wave","choices":[{"label":"趁其扎营时动手","next":"n5"},{"label":"先砸了他们备用的绳索","next":"n6"}]},"n5":{"text":"你们背靠背守在漆黑的客栈门洞，四周尽是湿漉漉的刀光与脚步。雨水顺着发梢滴落，手心全是冷汗却谁都不肯后退半步。只要对方跨过门槛一步，你们就要联手把这一关死守到底。","pose":"fight","choices":[{"label":"用计引他们自相残杀","next":"n7"},{"label":"硬拼到底拖到天亮","next":"n8"}]},"n6":{"text":"你们故意大呼引敌人远离客栈，将他们引到一处废弃石拱桥下。这里视野开阔便于周旋，桥下积水倒映着点点火光。敌人一拥而上，偏偏栽在你们早已踩熟地形的连手配合里。","pose":"run","choices":[{"label":"借地势将他们逐个分开","next":"n7"},{"label":"以退为进诱敌中伏","next":"n8"}]},"n7":{"text":"一声铜铃误导让黑衣人阵脚大乱，你们抓住空隙穿插其中，招式配合得前所未有地默契。转头对TA说一句心里话时，对方正好翻身护住你的背影，连喊话都来不及只用一个眼神便心领神会。","pose":"fight","choices":[{"label":"乘胜追击逼问主谋","next":"n9"},{"label":"见好就收保护众人","next":"n10"}]},"n8":{"text":"你们在雨中打得气息紊乱，却越打越有默契，几乎不用言语便能补足对方破绽。黑衣人见久攻不下，渐生退意。就在这时，远山传来一声悠长号角，来敌终于收队仓皇撤退。","pose":"fight","choices":[{"label":"暗中查看他们遗留之物","next":"n9"},{"label":"先安顿受惊的客人","next":"n10"}]},"n9":{"text":"你们在敌人遗落的包袱中翻出一张半张血书，落款赫然是十年前早已销声的某个旧门派。暴雨冲刷着石板路，证据虽少却足够牵出一张早已布好的大网。江湖从来没有真正太平，新的麻烦恐怕已悄悄盯上你们。","pose":"stand","choices":[{"label":"先找个避世之地歇脚","next":"n11"},{"label":"循着线索暗中查访","next":"n12"}]},"n10":{"text":"客栈众人还未从惊魂中回过神，便热情地要留你们吃最丰盛的宵夜压惊。老板娘端上热腾腾的羊汤，你们却在汤碗里发现一枚包好的小纸团，里面写着一行字：别回房，后院有埋伏。","pose":"sit","choices":[{"label":"装作无事继续喝汤","next":"n11"},{"label":"立刻翻窗离开","next":"n12"}]},"n11":{"text":"你们在偏僻山寺暂时落脚，香火里混着新雨的凉意。晨钟响起时，两人在檐下对坐饮茶，忽然发现对方肩头新添的伤痕。谁也没提昨夜的凶险，只是默默将披风披到对方肩上，相视一笑。","pose":"hug","ending":"感人","choices":[]},"n12":{"text":"你们循着线索追查到城中钱庄，却在库房里发现一整排被装进罐子的铜钱，每罐都贴着不同门派的名字。两人同时傻眼：原来江湖恩怨竟被这帮人做成了一门生意，而你们的名字如今也被贴在了其中一罐上。","pose":"wave","ending":"搞笑","choices":[]},"n13":{"text":"你们在城中寻得一间静谧小院暂住，夜夜伴着琴声入睡。某天清晨，对方在院中舞剑时突然回眸一笑，你才惊觉：原来相逢之初的惊险早已 past，而今却更难割舍的，是两颗在生死间贴得更近的心。","pose":"heart","ending":"温暖","choices":[]},"n14":{"text":"你们在门派旧址寻到一卷残册，记满了当年的恩怨与 reconciliation。合上册子时，对方忽然握住你的手说：江湖路长，往后无论去往何方，都与君同行。你点头，剑未出鞘，心却已安定。","pose":"heart","ending":"感人","choices":[]}}},{"id":"garden","title":"末日后的花园","emoji":"🌸","scene":"garden","start":"n0","nodes":{"n0":{"text":"你们在荒废的末日都市中穿行，最终找到一片被高墙围住的隐秘花园。藤蔓爬满断壁，残存的玫瑰却在尘埃中 stubbornly 盛开。你们站在门口，仿佛看见了久违的希望。","pose":"stand","choices":[{"label":"先进门探索","next":"n1"},{"label":"先确认是否安全","next":"n2"}]},"n1":{"text":"你们推开锈蚀的铁门，园中竟有一口仍在滴水的古井。藤蔓间露出几座石像，身姿却温柔得不像末日的产物。你们并肩走进去，园内空气里弥漫着一种说不清的甜香，让紧绷的心弦慢慢松动。","pose":"stand","choices":[{"label":"去古井边取水","next":"n3"},{"label":"先欣赏那些石像","next":"n4"}]},"n2":{"text":"你们绕着高墙仔细查看，发现墙角有几道 claw marks，却久远得像是多年前留下的。园内鸟鸣清脆，不像有危险。你们这才卸下防备，相视一笑：也许这个花园，就是命运给两人的礼物。","pose":"wave","choices":[{"label":"安心进门 explore","next":"n3"},{"label":"先在门口野餐","next":"n4"}]},"n3":{"text":"井水 unexpectedly 清澈甘甜，你们用找到的陶罐装满。喝下第一口时，对方忽然伸手抹掉你嘴角的水滴。两人同时愣住，随后都红了耳根。末日里最珍贵的，也许不是水，而是这种再平常不过的温柔。","pose":"heart","choices":[{"label":"继续往园深处走","next":"n5"},{"label":"先在井边休息","next":"n6"}]},"n4":{"text":"你们在石像前停步，发现它们雕刻的都是相拥的人。每座石像底座都刻着不同名字，像是某种古老誓约。你们忍不住模仿它们的姿势拍照，结果对方歪头撞到你额头，痛得两人同时 Adoption 作痛。","pose":"laugh","choices":[{"label":"继续探索花园","next":"n5"},{"label":"坐下来吃点干粮","next":"n6"}]},"n5":{"text":"园深处有一间玻璃暖房，里面竟开着各色花卉，其中一株巨大的向日葵正对着你们微微转头。你们站在玻璃前，阳光从残破的屋顶洒下，把对方的轮廓描成金色。转头对TA说一句心里话，才惊觉早已说得出口。","pose":"heart","choices":[{"label":"采一朵花送对方","next":"n7"},{"label":"在暖房里坐一会儿","next":"n8"}]},"n6":{"text":"你们席地而坐，分享所剩无几的罐头。一只胖胖的橘猫不知从哪里窜出，理直气壮地坐到你们中间，分明是来分一杯羹的。你们一边喂它一边笑，末日的沉重竟被这只胖猫轻而易举地驱散大半。","pose":"sit","choices":[{"label":"跟着猫去它藏身处","next":"n7"},{"label":"继续吃并和猫聊天","next":"n8"}]},"n7":{"text":"你们在暖房角落发现一株会发光的蓝花，花瓣在暗处微微闪烁。对方小心翼翼地将它摘下，别在你耳后。你低头时，它像一颗微型星星，把整座废城的黑暗都暂时点亮，而你只看见对方眼中倒映的自己。","pose":"heart","choices":[{"label":"许愿永远留在这","next":"n9"},{"label":"带蓝花一起离开","next":"n10"}]},"n8":{"text":"你们和橘猫玩到忘我，它竟然在你们腿上打起呼噜。你们忽然意识到：末日里，一只愿意 trust 你们的猫，比任何武器都珍贵。猫却并不领情，翻个身继续睡，仿佛在说：别吵，本喵在打盹。","pose":"laugh","choices":[{"label":"继续陪猫到天黑","next":"n9"},{"label":"开始搜寻更多物资","next":"n10"}]},"n9":{"text":"夜幕降临时，你们在暖房里相依而眠，橘猫 curled 在你们脚边。园外城市废墟里偶尔传来异响，但园内却安全得像另一个世界。你们在睡梦中无意识地靠近，手指交缠，仿佛在说：无论外面如何，我们永远在一起。","pose":"hug","ending": .stick-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.stick-name{font-size:13px;color:var(--inkl);}
.stick-svg{width:clamp(86px,22vw,110px);height:clamp(124px,30vw,148px);overflow:visible;}
.stick-svg .s{stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:320;stroke-dashoffset:320;animation:draw .92s ease forwards;}
.stick-svg .b{transform-origin:center bottom;animation:breath 2.8s ease-in-out infinite;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes breath{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.012);}}
.lobby-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.mode-card{border:none;border-radius:20px;padding:14px;text-align:left;background:rgba(255,255,255,.82);border:1px solid rgba(200,182,255,.32);box-shadow:0 18px 40px -28px rgba(184,146,255,1);display:flex;flex-direction:column;gap:4px;}
.mode-card:active{transform:scale(.98);}
.mode-card-t{font-weight:600;}
.mode-card-s{font-size:12px;color:var(--inkl);}
.mode-head{width:100%;display:flex;align-items:center;justify-content:space-between;}
.mode-title{font-weight:600;}
.icon-btn{border:none;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.8);border:1px solid rgba(200,182,255,.36);color:var(--ink);}
.mode-body{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:0 4px;}
.soft{border-radius:20px;background:rgba(255,255,255,.86);border:1px solid rgba(200,182,255,.26);padding:16px;display:flex;flex-direction:column;gap:10px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.pill{border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.32);font-size:13px;}
.pill.active{background:linear-gradient(90deg,#ffb5c2,#c8b6ff);color:#fff;border-color:transparent;}
.qa-q{text-align:center;font-size:16px;}
textarea.qa{width:100%;min-height:80px;border-radius:16px;border:1px solid rgba(200,182,255,.28);padding:10px 14px;background:rgba(255,255,255,.95);resize:none;font-size:14px;}
textarea.qa:disabled{opacity:.6;}
.reveal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.reveal-card{border-radius:16px;padding:14px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.26);min-height:110px;display:flex;flex-direction:column;gap:6px;}
.scene{position:relative;width:100%;height:150px;border-radius:20px;overflow:hidden;border:1px solid rgba(200,182,255,.28);background:radial-gradient(circle at top,rgba(255,255,255,.9),rgba(246,240,255,.9));}
.scene svg{position:absolute;inset:0;width:100%;height:100%;}
.log{display:flex;flex-direction:column;gap:8px;max-height:170px;overflow-y:auto;}
.log-item{align-self:flex-start;max-width:86%;padding:9px 14px;border-radius:16px 16px 16px 5px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.24);font-size:14px;}
.log-item.me{align-self:flex-end;border-radius:16px 16px 5px 16px;background:linear-gradient(90deg,rgba(255,181,194,.26),rgba(200,182,255,.26));}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice{border-radius:14px;padding:11px 14px;text-align:left;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.28);font-size:14px;}
.canvas-wrap{position:relative;width:100%;border-radius:22px;overflow:hidden;border:1px solid rgba(200,182,255,.3);}
#drawCanvas{width:100%;height:300px;display:block;background:radial-gradient(circle at top,#fff,#f9f6ff);touch-action:none;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.toolbar .c{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(200,182,255,.4);}
.toolbar .c.active{box-shadow:0 0 0 2px #c8b6ff;}
.toolbar select,.toolbar button{border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.32);}
.card-wall{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.note{border-radius:14px;padding:12px;background:#fff;box-shadow:0 10px 24px -18px rgba(184,146,255,1);transform:rotate(-1deg);font-size:13px;}
.note:nth-child(even){transform:rotate(1deg);}
.note .meta{font-size:11px;color:var(--inkl);margin-top:6px;}
.chat{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;}
.chat-b{align-self:flex-start;max-width:80%;padding:9px 14px;border-radius:16px 16px 16px 5px;background:rgba(255,255,255,.9);border:1px solid rgba(200,182,255,.24);font-size:14px;}
.chat-b.me{align-self:flex-end;border-radius:16px 16px 5px 16px;background:linear-gradient(90deg,rgba(255,181,194,.26),rgba(200,182,255,.26));}
.actions{display:flex;flex-wrap:wrap;gap:8px;}
.action{border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.86);border:1px solid rgba(200,182,255,.32);font-size:13px;}
.heart-burst{position:fixed;pointer-events:none;z-index:20;font-size:26px;animation:burst 1.2s ease forwards;}
@keyframes burst{0%{transform:scale(0) translate(0,0);opacity:1;}100%{transform:scale(1.4) translate(var(--dx),var(--dy));opacity:0;}}
.flash-overlay{position:fixed;inset:0;pointer-events:none;z-index:21;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;}
.flash-overlay.show{opacity:1;}
.flash-overlay .big{font-size:64px;animation:pop .6s ease;}
@keyframes pop{0%{transform:scale(.4);}100%{transform:scale(1);}}

.mid-heart{font-size:26px;align-self:center;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.mc-e{font-size:20px;margin-right:4px}
.mode-card{transition:transform .2s,box-shadow .2s}.mode-card:hover{transform:translateY(-3px)}.mode-card:active{transform:scale(.96)}
#modeBody div[style*="display:flex;gap:8px"]>input.txt{flex:1;text-align:left}
#modeBody div[style*="display:flex;gap:8px"]>.btn{white-space:nowrap;flex-shrink:0}
.scene svg{width:100%;height:100%;display:block}
.rain-l{animation:rainf .8s linear infinite}@keyframes rainf{from{transform:translateY(-150px)}to{transform:translateY(0)}}
.twk{animation:twk 2s ease-in-out infinite}@keyframes twk{50%{opacity:.2}}
.wave-p{animation:wavep 4s ease-in-out infinite alternate}@keyframes wavep{to{transform:translateX(-40px)}}
.log-item{animation:fade .4s ease}
.fpair .stick-svg{width:90px;height:120px}
.flash-overlay{flex-direction:column!important;align-items:center!important;justify-content:center!important}.flash-overlay .big{font-size:clamp(26px,8vw,40px)!important;white-space:nowrap;text-align:center}.heart-burst{color:#ff8fa3!important}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="reconn">对方连接中断，正在尝试重连…</div>
<div id="toast-wrap" class="toast-wrap"></div>
<div id="flash" class="flash-overlay"><div class="big"></div></div>
<div id="app">
  <section id="s-home" class="screen active">
    <div class="glass">
      <div class="title">两颗星的距离</div>
      <div class="sub">在遥远的两端，我们依然靠近</div>
      <div class="field"><label class="sub" style="text-align:left;">昵称</label><input id="nameInput" class="txt" placeholder="写下你的名字" maxlength="12"></div>
      <div class="field"><label class="sub" style="text-align:left;">选择你的颜色</label><div id="colorGrid" class="color-grid"></div></div>
      <div class="row"><button id="createBtn" class="btn">创建房间</button></div>
      <div class="join-row"><input id="joinInput" class="txt" placeholder="房间码" maxlength="6"><button id="joinBtn" class="btn">加入</button></div>
      <div id="roomPanel" class="room-panel">
        <div class="sub">房间码</div>
        <div id="roomCode" class="room-code"></div>
        <button id="copyBtn" class="btn ghost">复制邀请链接</button>
        <div id="status" class="sub">等待对方加入…</div>
      </div>
    </div>
  </section>
  <section id="s-lobby" class="screen">
    <div class="glass">
      <div class="title" style="font-size:20px;letter-spacing:4px;">大厅</div>
      <div class="pair" id="lobbyPair"></div>
      <div class="lobby-grid">
        <button class="mode-card" data-mode="qa"><div class="mode-card-t"><span class="mc-e">💌</span> 心动问答</div><div class="mode-card-s">互相答问</div></button>
        <button class="mode-card" data-mode="adventure"><div class="mode-card-t"><span class="mc-e">📖</span> 共写冒险</div><div class="mode-card-s">共同冒险</div></button>
        <button class="mode-card" data-mode="guess"><div class="mode-card-t"><span class="mc-e">🎯</span> 默契猜猜</div><div class="mode-card-s">默契加分</div></button>
        <button class="mode-card" data-mode="draw"><div class="mode-card-t"><span class="mc-e">🎨</span> 一起画</div><div class="mode-card-s">实时画板</div></button>
        <button class="mode-card" data-mode="capsule"><div class="mode-card-t"><span class="mc-e">⏳</span> 时光胶囊</div><div class="mode-card-s">回忆与心愿</div></button>
        <button class="mode-card" data-mode="whisper"><div class="mode-card-t"><span class="mc-e">🤫</span> 悄悄话</div><div class="mode-card-s">动作与私语</div></button>
      </div>
    </div>
  </section>
  <section id="s-mode" class="screen">
    <div class="glass" style="flex:1;min-height:0;">
      <div class="mode-head">
        <div class="mode-title" id="modeTitle">模式</div>
        <div style="display:flex;gap:8px;">
          <button id="heartBtn" class="icon-btn">❤</button>
          <button id="backBtn" class="icon-btn">返回大厅</button>
        </div>
      </div>
      <div class="mode-body" id="modeBody"></div>
    </div>
  </section>
</div>
<script>
const COLORS=['#ff8fa3','#ffb5c2','#c8b6ff','#a8d8ea','#f9a8d4','#b8e0d2'];
let me={role:'guest',name:'',color:COLORS[0]};
let S={players:{host:{name:'',color:COLORS[0]},guest:{name:'',color:COLORS[1]}},mode:null,qa:{},adv:{},guess:{},capsule:{wall:[]},chat:[],strokes:[],draw:{promptIdx:0}};
let conn=null,peer=null,connected=false;
let reconnectTimer=null,hostPeerId=null;
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const el=$(id);if(el)el.classList.add('active');};
const toast=m=>{const w=$('toast-wrap');const t=document.createElement('div');t.className='toast';t.textContent=m;w.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2200);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stickSVG(pose,color){
  const c=color||'#ff8fa3';
  let arms='';let legs='';
  switch(pose){
    case 'wave': arms='<line x1="50" y1="46" x2="78" y2="30" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="22" y2="58" stroke="'+c+'" stroke-width="3"/>';break;
    case 'hug': arms='<path d="M46 46 Q30 56 24 70" stroke="'+c+'" stroke-width="3" fill="none"/><path d="M54 46 Q70 56 76 70" stroke="'+c+'" stroke-width="3" fill="none"/>';break;
    case 'run': arms='<line x1="50" y1="46" x2="74" y2="38" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="26" y2="56" stroke="'+c+'" stroke-width="3"/>';legs='<line x1="50" y1="78" x2="72" y2="104" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="28" y2="100" stroke="'+c+'" stroke-width="3"/>';break;
    case 'sit': legs='<line x1="50" y1="78" x2="34" y2="92" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="66" y2="92" stroke="'+c+'" stroke-width="3"/>';break;
    case 'heart': arms='<path d="M46 46 Q32 34 24 46 Q32 60 50 72 Q68 60 76 46 Q68 34 54 46" stroke="'+c+'" stroke-width="3" fill="none"/>';break;
    case 'fight': arms='<line x1="50" y1="46" x2="78" y2="40" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="22" y2="40" stroke="'+c+'" stroke-width="3"/>';break;
    case 'sad': arms='<line x1="50" y1="46" x2="70" y2="62" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="30" y2="62" stroke="'+c+'" stroke-width="3"/>';break;
    case 'dance': arms='<line x1="50" y1="46" x2="76" y2="28" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="24" y2="32" stroke="'+c+'" stroke-width="3"/>';legs='<line x1="50" y1="78" x2="70" y2="108" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="30" y2="96" stroke="'+c+'" stroke-width="3"/>';break;
    default: arms='<line x1="50" y1="46" x2="74" y2="58" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="46" x2="26" y2="58" stroke="'+c+'" stroke-width="3"/>';legs='<line x1="50" y1="78" x2="66" y2="108" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="34" y2="108" stroke="'+c+'" stroke-width="3"/>';
  }
  if(!legs) legs='<line x1="50" y1="78" x2="66" y2="108" stroke="'+c+'" stroke-width="3"/><line x1="50" y1="78" x2="34" y2="108" stroke="'+c+'" stroke-width="3"/>';
  return ('<svg class="stick-svg" viewBox="0 0 100 130"><g class="b"><circle cx="50" cy="24" r="12" stroke="'+c+'" stroke-width="3" class="s"/><line x1="50" y1="36" x2="50" y2="78" stroke="'+c+'" stroke-width="3" class="s"/>'+arms+legs+'</g></svg>').replace(/ class="s"/g,'').replace(/<(line|path|circle)/g,'<$1 class="s"');
}
function reduce(S,action,role){
  if(action.type==='setMode'){S.mode=action.mode;if(action.mode==='qa')S.qa={cat:'初遇回忆',idx:0,answers:{host:'',guest:''},revealed:false};if(action.mode==='adventure')S.adv={storyId:null,cur:'n0',log:[],turn:'host',ending:null};if(action.mode==='guess')S.guess={round:0,score:0,streak:0,roleTurn:'host',picked:{},revealed:false};if(action.mode==='capsule')S.capsule=S.capsule||{wall:[]};if(action.mode==='draw')S.draw=S.draw||{promptIdx:0};if(action.mode==='whisper')S.whisper=S.whisper||{last:null};}
  if(action.type==='backLobby'){S.mode=null;}
  if(action.type==='qaCat'){S.qa.cat=action.cat;S.qa.idx=0;S.qa.answers={host:'',guest:''};S.qa.revealed=false;}
  if(action.type==='qaNext'){const qs=window.GAME_DATA.questions.filter(q=>q.cat===S.qa.cat);S.qa.idx=(S.qa.idx+1)%qs.length;S.qa.answers={host:'',guest:''};S.qa.revealed=false;}
  if(action.type==='qaAnswer'){S.qa.answers[role]=action.text;if(S.qa.answers.host&&S.qa.answers.guest)S.qa.revealed=true;}
  if(action.type==='qaReact'){S.qa.react={by:role,ts:Date.now()};}
  if(action.type==='qaReveal'){S.qa.revealed=true;}
  if(action.type==='advPick'){S.adv.storyId=action.id;S.adv.log=[];S.adv.turn='host';S.adv.ending=null;S.adv.pose=null;const st0=window.GAME_DATA.adventures.find(a=>a.id===action.id);S.adv.cur=st0?st0.start||'n0':'n0';if(st0){const n0=st0.nodes[S.adv.cur];S.adv.log.push({who:'sys',text:n0.text});}}
  if(action.type==='advChoice'){const st=window.GAME_DATA.adventures.find(a=>a.id===S.adv.storyId);const node=st&&st.nodes[S.adv.cur];if(node&&node.choices){const ch=node.choices.find(c=>c.label===action.label);if(ch){S.adv.log.push({who:role,text:(S.players[role].name||'')+' 选择了：'+ch.label});S.adv.cur=ch.next;const nn=st.nodes[S.adv.cur];if(nn){S.adv.log.push({who:'sys',text:nn.text});S.adv.pose=null;}}}S.adv.turn=role==='host'?'guest':'host';const n2=st&&st.nodes[S.adv.cur];if(n2&&n2.ending)S.adv.ending=n2.ending;}
  if(action.type==='advFree'){const st=window.GAME_DATA.adventures.find(a=>a.id===S.adv.storyId);const node=st&&st.nodes[S.adv.cur];const name=S.players[role].name||role;const other=S.players[role==='host'?'guest':'host'].name;let text='';let pose='stand';const kr=(window.GAME_DATA.keywordReactions||[]).find(r=>r.keys.some(k=>action.text.includes(k)));if(kr){text=kr.text.replace('{name}',name).replace('{other}',other);pose=kr.pose;}else{const ev=window.GAME_DATA.randomEvents[Math.floor(Math.random()*window.GAME_DATA.randomEvents.length)];text=ev.text;pose=ev.pose;}S.adv.log.push({who:role,text:name+'：'+action.text});S.adv.log.push({who:'sys',text,pose});S.adv.pose=pose;S.adv.turn=role==='host'?'guest':'host';}
  if(action.type==='advRestart'){return reduce(S,{type:'advPick',id:S.adv.storyId},role);}
  if(action.type==='guessPick'){if(S.guess.revealed)return S;S.guess.picked[role]=action.val;if(S.guess.picked.host!==undefined&&S.guess.picked.guest!==undefined)return reduce(S,{type:'guessReveal'},role);}
  if(action.type==='guessReveal'){const h=S.guess.picked.host,g=S.guess.picked.guest;if(h!==undefined&&g!==undefined){if(h===g){S.guess.score=(S.guess.score||0)+1;S.guess.streak=(S.guess.streak||0)+1;}else{S.guess.streak=0;}S.guess.revealed=true;}}
  if(action.type==='guessNext'){S.guess.round=(S.guess.round||0)+1;S.guess.picked={};S.guess.revealed=false;S.guess.roleTurn=S.guess.roleTurn==='host'?'guest':'host';}
  if(action.type==='capsuleAdd'){S.capsule.wall.push({author:role,type:action.ctype,prompt:action.prompt||'',text:action.text,ts:Date.now()});}
  if(action.type==='chat'){S.chat.push({who:role,text:action.text});}
  if(action.type==='whisperAction'){S.whisper=S.whisper||{};S.whisper.last={action:action.act,by:role,ts:Date.now()};}
  if(action.type==='drawPrompt'){S.draw.promptIdx=action.idx;}
  if(action.type==='strokeAdd'){S.strokes.push(action.stroke);}
  if(action.type==='clearStrokes'){S.strokes=[];S.draw.clears=(S.draw.clears||0)+1;}
  return S;
}
function dispatch(action){
  if(me.role==='host'){reduce(S,action,me.role);broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();}
  else{if(conn&&conn.open)conn.send({type:'action',action});}
}
function broadcast(msg){if(conn&&conn.open)conn.send(msg);}
function burstHearts(){
  for(let i=0;i<12;i++){const h=document.createElement('div');h.className='heart-burst';h.textContent='❤';h.style.left=(window.innerWidth/2-12)+'px';h.style.top=(window.innerHeight/2-12)+'px';h.style.setProperty('--dx',(Math.random()*200-100)+'px');h.style.setProperty('--dy',(Math.random()*200-200)+'px');document.body.appendChild(h);setTimeout(()=>h.remove(),1200);}
}
function flashBig(txt){const f=$('flash');f.querySelector('.big').textContent=txt;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),1600);}
let lastKey='',lastLogLen=0,seenWhisper=0,seenReact=0;
function render(){
  const gd=window.GAME_DATA;
  const keep={};document.querySelectorAll('#modeBody textarea[id],#modeBody input[id]').forEach(el=>{if(el.type!=='color'&&el.type!=='range')keep[el.id]=el.value;});
  const focusId=document.activeElement&&document.activeElement.id;
  try{renderInner(gd);}catch(e){console.warn(e);}
  Object.keys(keep).forEach(id=>{const el=$(id);if(el&&!el.disabled&&!el.value)el.value=keep[id];});
  if(focusId){const f=$(focusId);if(f&&f!==document.activeElement&&f.tagName!=='BUTTON')f.focus();}
  const w=S.whisper&&S.whisper.last;if(w&&w.ts>seenWhisper){const fresh=seenWhisper>0||Date.now()-w.ts<5000;seenWhisper=w.ts;if(fresh&&w.by!==me.role)whisperAnim(w.action,w.by);}
  const r=S.qa&&S.qa.react;if(r&&r.ts>seenReact){seenReact=r.ts;if(r.by!==me.role){burstHearts();toast((S.players[r.by].name||'TA')+' 给了你一个抱抱 🤗');}}
}
function renderInner(gd){
  const lp=$('lobbyPair');if(lp){lp.innerHTML='<div class="stick-wrap">'+stickSVG(connected?'heart':'wave',S.players.host.color)+'<div class="stick-name">'+esc(S.players.host.name)+'</div></div><div class="mid-heart">💞</div><div class="stick-wrap">'+stickSVG(connected?'heart':'wave',S.players.guest.color)+'<div class="stick-name">'+esc(S.players.guest.name)+'</div></div>';}
  if(S.mode===null){lastKey='';show('s-lobby');return;}
  const key=S.mode+'|'+(S.mode==='draw'?(S.draw.promptIdx+'|'+(S.draw.clears||0)):'');if(S.mode==='draw'&&key===lastKey&&$('drawCanvas')){show('s-mode');return;}lastKey=key;
  show('s-mode');
  const title=$('modeTitle');const body=$('modeBody');
  if(!body)return;
  if(S.mode==='qa'){
    title.textContent='心动问答';

let drawing=false,ctx=null,last=null,eraser=false;
function initDraw(){
  const canvas=$('drawCanvas');if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineCap='round';ctx.lineJoin='round';
  // replay strokes
  (S.strokes||[]).forEach(s=>drawStroke(s));
  const colorPick=$('colorPick'),sizePick=$('sizePick');
  const getPos=e=>{const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height};};
  const start=e=>{drawing=true;last=getPos(e);};
  const move=e=>{if(!drawing)return;const p=getPos(e);const c=colorPick.value;const w=+sizePick.value;const stroke={from:last,to:p,color:eraser?'#ffffff':c,width:w,eraser};drawStroke(stroke);dispatchStroke(stroke);last=p;};
  const end=()=>{drawing=false;last=null;};
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();start(e);},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();end();},{passive:false});
  const eraserBtn=$('eraserBtn');if(eraserBtn)eraserBtn.onclick=()=>{eraser=!eraser;eraserBtn.textContent=eraser?'画笔':'橡皮';};
  const clearBtn=$('clearBtn');if(clearBtn)clearBtn.onclick=()=>dispatch({type:'clearStrokes'});
  const saveBtn=$('saveBtn');if(saveBtn)saveBtn.onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL();a.download='our-drawing.png';a.click();};
  const promptBtn=$('promptBtn');if(promptBtn)promptBtn.onclick=()=>{const gd=window.GAME_DATA;const idx=Math.floor(Math.random()*gd.drawPrompts.length);dispatch({type:'drawPrompt',idx});};
  const cp=$('colorPick');if(cp)cp.oninput=()=>{};
}
function drawStroke(s){
  if(!ctx)return;
  const canvas=$('drawCanvas');const r=canvas.getBoundingClientRect();
  ctx.strokeStyle=s.eraser?'#ffffff':s.color;ctx.lineWidth=s.width;
  ctx.beginPath();ctx.moveTo(s.from.x*r.width,s.from.y*r.height);ctx.lineTo(s.to.x*r.width,s.to.y*r.height);ctx.stroke();
}
function dispatchStroke(s){if(me.role==='host'){S.strokes.push(s);broadcast({type:'stroke',stroke:s});}else{if(conn)conn.send({type:'stroke',stroke:s});}}

const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){let c='';for(let i=0;i<6;i++)c+=CHARS[Math.floor(Math.random()*CHARS.length)];return c;}
function peerId(code){return 'lovegame-v1-'+code;}
function connectTo(code){
  const id=peerId(code);
  if(!peer||peer.destroyed)peer=new Peer();
  conn=peer.connect(id,{reliable:true});
  wireConn(conn);
}
function wireConn(c){
  c.on('open',()=>{if(c!==conn){try{conn&&conn.close()}catch(e){};conn=c;}connected=true;showReconn(false);toast('连上啦 💞');if(me.role==='guest'){c.send({type:'hello',name:me.name,color:me.color});}});
  c.on('data',d=>{
    if(d.type==='hello'){S.players.guest={name:d.name,color:(d.color===me.color?COLORS[(COLORS.indexOf(me.color)+2)%COLORS.length]:d.color)};if(me.role==='host'){S.players.host={name:me.name,color:me.color};broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();}}
    if(d.type==='sync'){S=d.S;render();}
    if(d.type==='action'){if(me.role==='host'){reduce(S,d.action,d.from||'guest');broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});render();}}
    if(d.type==='stroke'){drawStroke(d.stroke);if(me.role==='host'){S.strokes.push(d.stroke);}}
    if(false){const canvas=$('drawCanvas');if(canvas&&ctx)ctx.clearRect(0,0,canvas.width,canvas.height);if(me.role==='host'){S.strokes=[];broadcast({type:'sync',S:JSON.parse(JSON.stringify(S))});}}
  });
  c.on('close',()=>{if(c!==conn)return;connected=false;showReconn(true);startReconnect();});
  c.on('error',e=>{toast('连接错误：'+e.type);});
}
function showReconn(show){const r=$('reconn');if(!r)return;if(show){r.classList.remove('ok');r.textContent='对方连接中断，正在尝试重连…';r.classList.add('show');}else{r.classList.add('ok');r.textContent='重新连上啦 💞';setTimeout(()=>r.classList.remove('show'),2000);}}
function startReconnect(){
  if(reconnectTimer)clearInterval(reconnectTimer);
  reconnectTimer=setInterval(()=>{
    if(connected){clearInterval(reconnectTimer);reconnectTimer=null;return;}
    if(me.role==='guest'){
      if(peer&&peer.disconnected)peer.reconnect();else if(!peer||peer.destroyed){peer=new Peer();connectTo(hostPeerId?hostPeerId.replace('lovegame-v1-',''):'' );}else{connectTo(hostPeerId?hostPeerId.replace('lovegame-v1-',''):'');}
    }
  },3000);
}

  const name=$('nameInput').value.trim();const code=$('joinInput').value.trim().toUpperCase();if(!name){toast('先写个昵称');return;}if(!code){toast('输入房间码');return;}me.name=name;me.role='guest';hostPeerId=peerId(code);
  peer=new Peer();
  peer.on('open',()=>{if(!conn||!conn.open)connectTo(code);});peer.on('disconnected',()=>{setTimeout(()=>{try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()}catch(e){}},1500);});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){if(!S.players.host.name)toast('房间不存在或房主已离开，请检查房间码');}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error')toast('网络不稳定，正在重试…');else toast('连接出错：'+e.type);});
};
$('copyBtn').onclick=()=>{const code=$('roomCode').textContent;const url=location.origin+location.pathname+'?room='+code;navigator.clipboard.writeText(url).then(()=>toast('链接已复制'));};
// url auto fill
const params=new URLSearchParams(location.search);if(params.get('room')){$('joinInput').value=params.get('room');}
// lobby mode buttons
document.querySelectorAll('.mode-card[data-mode]').forEach(b=>b.onclick=()=>dispatch({type:'setMode',mode:b.dataset.mode}));
$('backBtn').onclick=()=>dispatch({type:'backLobby'});
$('heartBtn').onclick=()=>{dispatch({type:'whisperAction',act:'heart'});whisperAnim('heart',me.role);};
// expose
Object.defineProperty(window,'__game',{get:()=>({S,me,connected})});
</script>
</body>
</html>
